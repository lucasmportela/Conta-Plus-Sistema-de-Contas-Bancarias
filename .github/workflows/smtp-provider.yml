name: Teste SMTP do provedor real

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: "Confirmo o envio de uma única mensagem para SMTP_TEST_RECIPIENT."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smtp-provider:
    name: Envio de uma mensagem de teste
    if: ${{ inputs.send_test == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Validar secrets necessários
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_TEST_RECIPIENT: ${{ secrets.SMTP_TEST_RECIPIENT }}
        run: |
          test -n "$MAIL_SERVER" || { echo "Configure o secret MAIL_SERVER."; exit 1; }
          test -n "$MAIL_FROM" || { echo "Configure o secret MAIL_FROM."; exit 1; }
          test -n "$SMTP_TEST_RECIPIENT" || { echo "Configure SMTP_TEST_RECIPIENT."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testar conexão e envio pelo provedor configurado
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT || '587' }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_USE_TLS: ${{ secrets.MAIL_USE_TLS || 'true' }}
          MAIL_USE_SSL: ${{ secrets.MAIL_USE_SSL || 'false' }}
          SMTP_TEST_RECIPIENT: ${{ secrets.SMTP_TEST_RECIPIENT }}
        run: python scripts/smtp_provider_smoke.py
